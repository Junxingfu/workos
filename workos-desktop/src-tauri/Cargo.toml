[package]
name = "workos-desktop"
version = "0.2.0"
description = "WorkOS local desktop workspace"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
